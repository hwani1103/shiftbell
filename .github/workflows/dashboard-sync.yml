# 관리자 대시보드용 GA4 -> Firestore 동기화 (매일 한국 시간 12:17).
# 설정 방법은 admin_dashboard/README.md 의 "1회 설정" 참고. 시크릿 이름: GA4_SERVICE_ACCOUNT_JSON
name: dashboard-sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '운영자가 요청한 추가 집계 (하루 1회 제한 예외)'
        type: boolean
        default: false

concurrency:
  group: dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin_dashboard/sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin_dashboard/sync/package-lock.json
      - run: npm ci
      - name: 변환 로직 테스트
        run: npm test
      - name: GA4 -> Firestore 동기화
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: '553838010'
          GA4_STREAM_ID: '15763725797'   # 플레이 출시 앱(android)만. dev·웹 스트림은 집계하지 않는다.
          GA4_WEB_STREAM_ID: '15763713126' # 웹 친구 근무표 성공 열람은 별도 요약으로만 집계한다.
          FIREBASE_PROJECT_ID: shiftbell-29f31
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GA4_SERVICE_ACCOUNT_JSON 시크릿이 없어 대시보드를 동기화할 수 없습니다."
            exit 1
          fi
          if [ '${{ inputs.force }}' = 'true' ]; then
            node sync.mjs --force
          else
            node sync.mjs
          fi
