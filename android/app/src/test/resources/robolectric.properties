# android/app/src/test/resources/robolectric.properties
#
# Robolectric 4.14.1은 아직 SDK 36을 지원하지 않음(최대 35) - 이 앱의
# compileSdk/targetSdk=36(build.gradle.kts)과 충돌해서 Robolectric 테스트가
# "targetSdkVersion=36 > maxSdkVersion=35"로 초기화 자체에 실패함(2026-09-12,
# 테스트_계획_2026-09-12.md B-2 인프라 구축 중 발견). 이 파일로 Robolectric
# 테스트에서만 시뮬레이션할 SDK를 34(Android 14)로 고정 - 실제 앱의 compileSdk/
# targetSdk 값 자체는 전혀 안 바뀜, 테스트 실행 시 Robolectric이 흉내 내는
# 프레임워크 버전만 34로 맞추는 것.
# Robolectric이 SDK 36을 지원하는 버전을 릴리스하면 이 설정은 지워도 됨.
sdk=34
