name: shiftbell
description: 교대근무자를 위한 자동 알람 관리 앱
publish_to: 'none'
version: 1.0.22+24

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ⭐ 영어 현지화(i18n) 인프라 - flutter_localizations(SDK) + intl + .arb +
  # 자동 생성되는 AppLocalizations 클래스. lib/l10n/app_ko.arb, app_en.arb가
  # 원본이고, `flutter gen-l10n`(또는 `flutter pub get`/`flutter run` 시 자동)이
  # .dart_tool/flutter_gen/gen_l10n/app_localizations.dart를 생성함. l10n.yaml
  # 참고. 교대시계_영어화_현지화_보고서_영문판.md에 전체 결정 사항 기록.
  flutter_localizations:
    sdk: flutter

  # ⭐ 웹뷰어(lib/web_main.dart) 전용 - URL을 해시(#/?code=...) 대신 일반 경로/쿼리
  # (/?code=...)로 만들기 위해 씀(usePathUrlStrategy). 진짜 앱(main.dart)은 웹
  # entry point를 아예 안 쓰니 영향 없음.
  flutter_web_plugins:
    sdk: flutter

  path: ^1.8.3

  numberpicker: ^2.1.2

  flutter_riverpod: ^2.4.9

  # 알람 관련
  flutter_local_notifications: ^17.0.0
  # android_alarm_manager_plus: ^4.0.0
  timezone: ^0.9.2
  permission_handler: ^11.0.0
  
  # 로컬 저장소
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # 상태 관리
  provider: ^6.1.1
  
  # UI
  intl: ^0.20.2
  table_calendar: ^3.0.9
  flutter_screenutil: ^5.9.0

  # 유틸
  uuid: ^4.2.2

  # 오디오 재생 (알람음 미리듣기)
  audioplayers: ^5.2.1

  # 앱 업데이트 체크
  package_info_plus: ^8.1.2
  url_launcher: ^6.2.1

  # ⭐ 친구 공유 - 카카오톡/SMS 등 OS 공유 시트로 바로 넘기기
  share_plus: ^10.1.4

  # ⭐ 친구 공유 v1 - Firestore 연동 (친구공유_v1_스펙.md 참고). firebase_options.dart는
  # 아직 플레이스홀더 - `flutterfire configure` 실행 전까지는 Firebase.initializeApp()이
  # 조용히 실패하고 친구공유 기능만 비활성화됨 (firebase_bootstrap.dart 참고, 다른 기능엔
  # 영향 없음).
  # ⭐ 2026-08-14: 3.x/5.x대는 firebase_core_web이 구식 JS interop(package:js)이라
  # 최신 Flutter web 부트스트랩과 안 맞아 Firebase.initializeApp()이 웹에서
  # "channel-error"로 조용히 실패했음(네이티브 앱은 영향 없음 - JS interop은 웹 전용
  # 경로). firebase_core_web 3.x(dart:js_interop 재작성)로 넘어가는 4.x/6.x대로 업그레이드.
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  # ⭐ 로그인 화면 없이 "이 기기"를 구분하기 위한 익명 인증. Firestore 보안 규칙이
  # "본인 문서만 write 가능"을 실제로 강제하려면(문서 ID를 안다고 해서 write까지
  # 되면 안 됨 - 친구는 read만 해야 함) uid가 필요함. Spark 무료 플랜 포함,
  # 사용자가 콘솔에서 "Anonymous" 로그인 방법만 켜주면 됨.
  firebase_auth: ^6.5.7
  # ⭐ 2026-08-25 - Kotlin을 2.3.0으로 올리면서 9.x로 복귀함(코틀린_버전업_계획.md
  # 참고) - 5.1.0으로 고정했던 이유(구버전 Kotlin과의 metadata 불일치)가 해소됨.
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # ⭐ l10n.yaml 설정에 따라 lib/l10n/app_*.arb → AppLocalizations 자동 생성
  generate: true

  # assets:
  #   - assets/sounds/  # 제거: res/raw만 사용

  # ⭐ 2026-08-25 - 아이콘 픽커(ui_theme_lab_screen.dart)에서 "실제로 설치된
  # 아이콘"을 그대로 불러와 기준 삼아 보여주기 위해 등록. 아이콘을 다시 바꿀
  # 때 assets/icon/gen_icon.py로 재생성하면 이 자산도 자동으로 최신 걸 가리킴
  # (파일 경로가 그대로라서 - 임시 화면 다 쓰고 나면 이 항목도 같이 지울 것).
  assets:
    - assets/icon/app_icon_foreground.png

# ⭐ 앱 아이콘 - 2026-08-25 3차 개정, "17번" 팔레트(네이비/골드/코랄, 배경
# 단색)로 최종 확정. assets/icon/gen_icon.py로 2장을 생성함 -
# app_icon.png(레거시, 배경 포함) / app_icon_foreground.png(적응형 아이콘
# 전경, 투명 배경). 배경이 이제 단색이라 adaptive_icon_background는 hex로
# 직접 지정(이미지 경로 불필요 - 예전 그라데이션판의 app_icon_background.png는
# 삭제함).
# `dart run flutter_launcher_icons` 실행하면 android/app/src/main/res/mipmap-*/
# 전체가 재생성됨 - 아이콘을 다시 바꾸고 싶으면 이 두 PNG를 다시 만들고 재실행하면 됨.
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"