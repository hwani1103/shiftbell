# flutter_localizations 코드 생성 설정.
# `flutter gen-l10n` 또는 `flutter pub get`/`flutter run` 시 자동 실행되어
# lib/l10n/app_ko.arb (template-arb-file) + app_en.arb를 읽고
# .dart_tool/flutter_gen/gen_l10n/app_localizations.dart 를 생성함.
#
# template-arb-file을 한국어(app_ko.arb)로 둔 이유: 이 앱은 한국어가
# "원본"이고 영어가 번역본이므로, 새 키를 추가할 때 한국어 쪽에서 시작하는
# 흐름이 자연스러움. arb-dir 안의 다른 모든 app_*.arb가 이 템플릿의 키 집합을
# 따라야 함(gen-l10n이 누락된 키를 빌드 시점에 경고함).
arb-dir: lib/l10n
template-arb-file: app_ko.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
output-dir: lib/l10n/generated
