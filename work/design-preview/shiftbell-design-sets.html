<div id="sb-design-sets" class="viz-carousel viz-dotted-background" aria-label="교대시계 공통 디자인 세트" data-previous-label="이전 디자인" data-next-label="다음 디자인">
  <section data-variant="쿨 블루" aria-label="쿨 블루 디자인"><div class="sb-stage" data-set="blue"></div></section>
  <section data-variant="소프트 세이지" aria-label="소프트 세이지 디자인" hidden><div class="sb-stage" data-set="sage"></div></section>
  <section data-variant="웜 오트밀" aria-label="웜 오트밀 디자인" hidden><div class="sb-stage" data-set="oat"></div></section>
</div>
<style>
#sb-design-sets{color-scheme:inherit}
#sb-design-sets *{box-sizing:border-box}
#sb-design-sets .sb-stage{--sb-ink:light-dark(#253449,#edf1f7);--sb-muted:light-dark(#607086,#a7b3c3);--sb-paper:light-dark(#fff,#1f2938);--sb-ground:light-dark(#f3f6fa,#161e29);--sb-line:light-dark(#dce3ec,#384456);--sb-danger:light-dark(#a93c44,#ffafb5);--sb-danger-soft:light-dark(#fff0f0,#43292e);--sb-disabled:light-dark(#e9edf2,#354052);--sb-disabled-ink:light-dark(#7c8796,#b0b9c7);--sb-focus:light-dark(#233f7d,#b0ccff);--sb-accent:light-dark(#385fa4,#adc8ff);--sb-on:light-dark(#fff,#182846);--sb-tint:light-dark(#eaf0fb,#293b57);--sb-shadow:light-dark(#243a5812,#00000035);--sb-radius:14px;--sb-control:12px;font-family:"Segoe UI","Malgun Gothic",sans-serif;color:var(--sb-ink);font-size:14px;line-height:1.5;padding:22px 16px;min-height:1100px}
#sb-design-sets [data-set="sage"]{--sb-ink:light-dark(#2a3c37,#e8f1ed);--sb-muted:light-dark(#63756c,#b0bfb7);--sb-paper:light-dark(#fffefa,#232e28);--sb-ground:light-dark(#f3f5ef,#19221d);--sb-line:light-dark(#dde4d9,#3b4b41);--sb-accent:light-dark(#44685a,#b6d5c3);--sb-on:light-dark(#fff,#21382c);--sb-tint:light-dark(#eaf1e6,#34463a);--sb-focus:light-dark(#355b4b,#b6d5c3);--sb-radius:23px;--sb-control:24px}
#sb-design-sets [data-set="oat"]{--sb-ink:light-dark(#3c3b39,#f1ece5);--sb-muted:light-dark(#716e68,#c0b8ac);--sb-paper:light-dark(#fffdf8,#302b25);--sb-ground:light-dark(#f5f1e9,#211e19);--sb-line:light-dark(#e5dfd4,#51493e);--sb-accent:light-dark(#586780,#c1cee5);--sb-on:light-dark(#fff,#253044);--sb-tint:light-dark(#eceef3,#39404c);--sb-focus:light-dark(#425978,#c1cee5);--sb-radius:10px;--sb-control:9px}
#sb-design-sets .sb-sethead{max-width:688px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:center;gap:18px;padding-right:82px}
#sb-design-sets .sb-eyebrow{font-size:11px;letter-spacing:2px;color:var(--sb-muted);margin-bottom:5px}
#sb-design-sets .sb-name{font-size:23px;font-weight:600;letter-spacing:-.7px;margin:0}
#sb-design-sets .sb-subtitle{color:var(--sb-muted);font-size:12px;margin-top:5px}
#sb-design-sets .sb-palette{display:flex;gap:6px}

#sb-design-sets .sb-swatch:nth-child(2){background:var(--sb-tint)}
#sb-design-sets .sb-swatch:nth-child(3){background:var(--sb-ground)}
#sb-design-sets .sb-swatch:nth-child(4){background:var(--sb-danger)}
#sb-design-sets .sb-layout{display:grid;grid-template-columns:minmax(0,342px) minmax(0,322px);gap:24px;justify-content:center;align-items:start}
#sb-design-sets button,#sb-design-sets input,#sb-design-sets select{font:inherit;color:inherit}
#sb-design-sets button{touch-action:manipulation}
#sb-design-sets button:focus-visible,#sb-design-sets input:focus-visible,#sb-design-sets select:focus-visible{outline:3px solid var(--sb-focus);outline-offset:3px}
#sb-design-sets button:active:not(:disabled){transform:translateY(1px)}
#sb-design-sets .sb-phone{position:relative;background:var(--sb-ground);border:1px solid var(--sb-line);border-radius:30px;overflow:hidden;box-shadow:0 12px 36px var(--sb-shadow);min-height:714px}
#sb-design-sets .sb-status{display:flex;justify-content:space-between;padding:14px 22px 7px;font-size:12px;font-weight:600}
#sb-design-sets .sb-top{padding:10px 20px 16px;display:flex;align-items:center;justify-content:space-between}
#sb-design-sets .sb-brand{font-size:17px;font-weight:600;letter-spacing:-.5px}
#sb-design-sets .sb-iconbtn{background:transparent;border:0;border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--sb-muted)}
#sb-design-sets .sb-content{padding:0 16px 20px}
#sb-design-sets .sb-monthrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px}
#sb-design-sets .sb-month{background:transparent;border:0;padding:8px 0;display:flex;align-items:center;gap:7px;font-weight:600;font-size:17px;white-space:nowrap}
#sb-design-sets .sb-next{text-align:right;color:var(--sb-muted);font-size:11px;max-width:140px}
#sb-design-sets .sb-next strong{display:block;font-size:12px;font-weight:500;color:var(--sb-ink)}
#sb-design-sets .sb-calendar{padding:13px 10px;background:var(--sb-paper);border:1px solid var(--sb-line);border-radius:var(--sb-radius)}
#sb-design-sets .sb-week,#sb-design-sets .sb-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}

#sb-design-sets .sb-day small{font-size:9px;color:var(--sb-muted)}
#sb-design-sets .sb-day.sb-out{opacity:.45}
#sb-design-sets .sb-day.sb-selected{background:var(--sb-accent);color:var(--sb-on)}
#sb-design-sets .sb-day.sb-selected small{color:var(--sb-on)}

#sb-design-sets .sb-sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px;font-size:13px;font-weight:600}
#sb-design-sets .sb-caption{font-size:11px;color:var(--sb-muted);font-weight:400}
#sb-design-sets .sb-alarm{background:var(--sb-paper);border:1px solid var(--sb-line);border-radius:var(--sb-radius);padding:16px}
#sb-design-sets .sb-alarmline{display:flex;align-items:center;justify-content:space-between;gap:12px}
#sb-design-sets .sb-time{font-size:29px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#sb-design-sets .sb-tag{display:inline-flex;gap:4px;align-items:center;background:var(--sb-tint);color:var(--sb-accent);padding:4px 9px;border-radius:7px;font-size:11px}
#sb-design-sets .sb-alarmdetail{color:var(--sb-muted);font-size:12px;margin:3px 0 14px}
#sb-design-sets .sb-rule{height:1px;background:var(--sb-line);margin:14px 0}
#sb-design-sets .sb-actions{display:flex;gap:8px;flex-wrap:wrap}
#sb-design-sets .sb-btn{border:1px solid var(--sb-line);background:var(--sb-paper);border-radius:var(--sb-control);padding:10px 14px;font-weight:500;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px}
#sb-design-sets .sb-btn.sb-primary{background:var(--sb-accent);color:var(--sb-on);border-color:transparent}
#sb-design-sets .sb-btn.sb-soft{background:var(--sb-tint);color:var(--sb-accent);border-color:transparent}
#sb-design-sets .sb-btn.sb-danger{background:var(--sb-danger-soft);color:var(--sb-danger);border-color:transparent}
#sb-design-sets .sb-btn.sb-quiet{border-color:transparent;background:transparent;color:var(--sb-muted)}
#sb-design-sets .sb-btn:disabled{background:var(--sb-disabled);color:var(--sb-disabled-ink);border-color:transparent;cursor:not-allowed}
#sb-design-sets .sb-fill{flex:1}
#sb-design-sets .sb-chips{display:flex;gap:6px;flex-wrap:wrap}
#sb-design-sets .sb-chip{border:1px solid var(--sb-line);background:var(--sb-paper);border-radius:var(--sb-control);padding:7px 12px;font-size:12px;min-height:36px}
#sb-design-sets .sb-chip[aria-pressed="true"]{background:var(--sb-tint);border-color:var(--sb-accent);color:var(--sb-accent);font-weight:600}
#sb-design-sets .sb-note{font-size:12px;color:var(--sb-muted);display:flex;gap:9px;align-items:center;padding:15px 3px 0}
#sb-design-sets .sb-nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sb-paper);border-top:1px solid var(--sb-line);padding:10px 8px 18px}
#sb-design-sets .sb-navitem{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--sb-muted);padding:6px 0;border-radius:13px}
#sb-design-sets .sb-navitem.sb-active{color:var(--sb-accent);background:var(--sb-tint)}
#sb-design-sets .sb-kit{background:var(--sb-paper);border:1px solid var(--sb-line);border-radius:var(--sb-radius);padding:20px}
#sb-design-sets .sb-kittitle{font-size:15px;font-weight:600;margin:0 0 18px}
#sb-design-sets .sb-label{display:block;font-size:11px;font-weight:500;color:var(--sb-muted);margin:20px 0 9px;letter-spacing:.3px}
#sb-design-sets .sb-field{width:100%;background:var(--sb-paper);border:1px solid var(--sb-line);border-radius:var(--sb-control);padding:11px 12px;min-width:0;font-size:14px}
#sb-design-sets .sb-fieldlabel{font-size:12px;margin-bottom:6px;display:block}
#sb-design-sets .sb-help{font-size:11px;color:var(--sb-muted);margin-top:6px}
#sb-design-sets .sb-choice{width:100%;justify-content:space-between;text-align:left;margin-bottom:8px}
#sb-design-sets .sb-choice span{color:var(--sb-muted);font-variant-numeric:tabular-nums}
#sb-design-sets .sb-switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;margin-top:16px}
#sb-design-sets .sb-toggle{appearance:none;width:40px;height:24px;border:1px solid var(--sb-line);border-radius:20px;background:var(--sb-disabled);position:relative;flex:none}
#sb-design-sets .sb-toggle:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:var(--sb-muted);transition:transform .16s}
#sb-design-sets .sb-toggle:checked{background:var(--sb-accent);border-color:var(--sb-accent)}
#sb-design-sets .sb-toggle:checked:after{transform:translateX(16px);background:var(--sb-on)}
#sb-design-sets .sb-preference{display:block;width:100%;margin-top:18px}
#sb-design-sets .sb-footer{max-width:688px;margin:18px auto 0;color:var(--sb-muted);font-size:11px;min-height:18px}
#sb-design-sets .sb-overlay{position:absolute;inset:0;background:#101a2b59;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
#sb-design-sets .sb-overlay[hidden]{display:none}
#sb-design-sets .sb-dialog{background:var(--sb-paper);border:1px solid var(--sb-line);border-radius:calc(var(--sb-radius) + 5px);padding:22px 18px;width:100%;max-width:304px;box-shadow:0 20px 60px var(--sb-shadow)}
#sb-design-sets .sb-dialog h3{font-size:18px;letter-spacing:-.4px;font-weight:600;margin:0 0 6px}
#sb-design-sets .sb-dialog p{font-size:12px;color:var(--sb-muted);margin:0 0 20px}
#sb-design-sets .sb-dialog .sb-actions{margin-top:22px}
#sb-design-sets .sb-timeinputs{display:flex;align-items:center;gap:10px;margin:20px 0}
#sb-design-sets .sb-timeinputs label{flex:1;min-width:0}
#sb-design-sets .sb-number{font-size:28px;text-align:center;font-variant-numeric:tabular-nums;padding:12px 2px;background:var(--sb-tint);border-color:transparent;color:var(--sb-accent)}
#sb-design-sets .sb-preset{display:flex;gap:6px;flex-wrap:wrap}
#sb-design-sets .sb-monthgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
#sb-design-sets .sb-monthgrid button{padding:11px 0}
#sb-design-sets .sb-yearrow{display:flex;align-items:center;justify-content:space-between;background:var(--sb-ground);border-radius:var(--sb-control);padding:2px}
#sb-design-sets .sb-yearrow strong{font-size:16px;font-weight:600}
#sb-design-sets .sb-destructive-fill{background:var(--sb-danger)!important;color:light-dark(#fff,#351b20)!important}
#sb-design-sets .sb-toast{background:var(--sb-tint);color:var(--sb-accent);border-radius:var(--sb-control);padding:12px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
#sb-design-sets [data-set="sage"] .sb-calendar{border-color:transparent;box-shadow:0 3px 15px var(--sb-shadow)}
#sb-design-sets [data-set="sage"] .sb-alarm{border-color:transparent;box-shadow:0 4px 18px var(--sb-shadow)}
#sb-design-sets [data-set="sage"] .sb-tag{border-radius:20px}
#sb-design-sets [data-set="sage"] .sb-dialog{border-radius:28px}
#sb-design-sets [data-set="sage"] .sb-overlay{align-items:flex-end;padding:0}
#sb-design-sets [data-set="sage"] .sb-dialog{max-width:none;border-radius:28px 28px 0 0;padding:26px 22px 28px}
#sb-design-sets [data-set="sage"] .sb-dialog:before{content:"";display:block;width:34px;height:4px;border-radius:4px;background:var(--sb-line);margin:-12px auto 18px}
#sb-design-sets [data-set="oat"] .sb-calendar{background:transparent;border:0;padding:8px 0}
#sb-design-sets [data-set="oat"] .sb-alarm{border:0;border-top:2px solid var(--sb-line);border-bottom:1px solid var(--sb-line);border-radius:0;background:transparent;padding:16px 2px}
#sb-design-sets [data-set="oat"] .sb-day.sb-selected{border-radius:50%;width:37px;justify-self:center}
#sb-design-sets [data-set="oat"] .sb-top{border-bottom:1px solid var(--sb-line);margin-bottom:12px}
#sb-design-sets [data-set="oat"] .sb-tag{background:transparent;border:1px solid var(--sb-line);color:var(--sb-muted)}
#sb-design-sets [data-set="oat"] .sb-kit{border-top:3px solid var(--sb-accent)}
#sb-design-sets [data-set="oat"] .sb-chip[aria-pressed="true"]{background:var(--sb-accent);color:var(--sb-on)}
#sb-design-sets svg{width:17px;height:17px;stroke-width:1.7;flex-shrink:0}
@media(max-width:600px){#sb-design-sets .sb-stage{padding:18px 4px;min-height:1580px}#sb-design-sets .sb-layout{grid-template-columns:minmax(0,360px);gap:20px}#sb-design-sets .sb-sethead{max-width:360px;padding-right:82px}#sb-design-sets .sb-palette{display:none}#sb-design-sets .sb-name{font-size:21px}#sb-design-sets .sb-btn{min-height:44px}#sb-design-sets .sb-chip{min-height:40px}#sb-design-sets .sb-kit{padding:18px}#sb-design-sets .sb-footer{max-width:360px}}
@media(prefers-reduced-motion:reduce){#sb-design-sets *{transition:none!important;animation:none!important}}
</style>
<script>
(()=>{
 const root=document.getElementById('sb-design-sets');
 const designs={blue:{name:'쿨 블루',subtitle:'정돈된 윤곽 · 명확한 조작',tone:'블루 강조 / 얇은 테두리 / 중간 둥글기',radius:14},sage:{name:'소프트 세이지',subtitle:'부드러운 면 · 편안한 여백',tone:'세이지 강조 / 부드러운 카드 / 바텀시트',radius:23},oat:{name:'웜 오트밀',subtitle:'따뜻한 중립색 · 절제된 구조',tone:'오트밀 바탕 / 블루그레이 강조 / 평면적 구분',radius:10}};
 const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const saveState=(name)=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preferredDesign:name},privateContent:{}}).catch(()=>{});};
 root.querySelectorAll('.sb-stage').forEach(stage=>{
  const type=stage.dataset.set,design=designs[type];
  const state={hour:7,minute:30,year:2026,month:10,selectedDay:12,deleted:false,sound:'진동',snooze:5};
  const days=Array.from({length:35},(_,i)=>{const day=i-4+1;const outside=day<1||day>31;const shown=day<1?day+30:day>31?day-31:day;return `<button type="button" class="sb-day cursor-interaction ${outside?'sb-out':''} ${day===12?'sb-selected sb-today':''}" data-day="${day}" aria-label="${outside?'다른 달 ':''}${shown}일 ${outside?'':(day===12||day===13)?'주간':(day===12||day===13)?'주간':day%4===0?'휴무':day%4===1?'야간':'주간'}" aria-pressed="${day===12}"><span>${shown}</span><small>${outside?'':(day===12||day===13)?'주간':day%4===0?'휴무':day%4===1?'야간':'주간'}</small></button>`;}).join('');
  stage.innerHTML=`<header class="sb-sethead"><div><div class="sb-eyebrow">SHIFTBELL / DESIGN STUDY</div><h2 class="sb-name">${design.name}</h2><div class="sb-subtitle">${design.subtitle}</div></div><div class="sb-palette" aria-label="강조·선택·배경·삭제 색상"><span class="sb-swatch"></span><span class="sb-swatch"></span><span class="sb-swatch"></span><span class="sb-swatch"></span></div></header>
   <div class="sb-layout"><div class="sb-phone" aria-label="교대시계 달력 미리보기"><div class="sb-status"><span>9:41</span><span>LTE · 100%</span></div><div class="sb-top"><span class="sb-brand">교대시계</span><button type="button" class="sb-iconbtn cursor-interaction" data-action="settings" aria-label="설정 미리보기">${icon('sliders-horizontal')}</button></div><div class="sb-content"><div class="sb-monthrow"><button type="button" class="sb-month cursor-interaction" data-action="month"><span data-month-label>2026년 10월</span>${icon('chevron-down')}</button><div class="sb-next">다음 알람<strong data-next>내일 07:30 · 진동</strong></div></div><div class="sb-calendar"><div class="sb-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="sb-days">${days}</div></div><div class="sb-sectionhead"><span data-date-label>10월 12일 · 월요일</span><span class="sb-caption">오늘</span></div><div class="sb-chips" data-group="shift"><button class="sb-chip cursor-interaction" type="button" aria-pressed="true">주간</button><button class="sb-chip cursor-interaction" type="button" aria-pressed="false">야간</button><button class="sb-chip cursor-interaction" type="button" aria-pressed="false">휴무</button></div><div class="sb-sectionhead"><span>근무 알람</span><span class="sb-caption">자동 예약</span></div><div data-alarm-area><div class="sb-alarm"><div class="sb-alarmline"><span class="sb-time" data-time>07:30</span><span class="sb-tag">${icon('vibrate')}<span data-sound>진동</span></span></div><div class="sb-alarmdetail">주간근무 · 당일 알람</div><div class="sb-actions"><button class="sb-btn sb-soft sb-fill cursor-interaction" type="button" data-action="time">${icon('clock-3')}시간 변경</button><button class="sb-btn sb-danger cursor-interaction" type="button" data-action="delete" aria-label="알람 삭제">${icon('trash-2')}삭제</button></div></div></div><div class="sb-note">${icon('sticky-note')}<span>메모 · 인수인계 확인</span></div></div><nav class="sb-nav" aria-label="앱 탭"><button class="sb-navitem sb-active cursor-interaction" type="button" data-nav="달력">${icon('calendar-days')}달력</button><button class="sb-navitem cursor-interaction" type="button" data-nav="다음 알람">${icon('alarm-clock')}다음 알람</button><button class="sb-navitem cursor-interaction" type="button" data-nav="일정">${icon('list-checks')}일정</button><button class="sb-navitem cursor-interaction" type="button" data-nav="설정">${icon('settings-2')}설정</button></nav><div class="sb-overlay" hidden></div></div>
   <aside class="sb-kit" aria-label="${design.name} 공통 요소"><h3 class="sb-kittitle">공통 요소</h3><div class="sb-caption">${design.tone}</div><span class="sb-label">버튼 · 행동의 중요도</span><div class="sb-actions"><button class="sb-btn sb-primary cursor-interaction" type="button" data-action="save">저장</button><button class="sb-btn cursor-interaction" type="button" data-action="cancel">취소</button><button class="sb-btn sb-danger cursor-interaction" type="button" data-action="delete">삭제</button></div><div class="sb-actions" style="margin-top:8px"><button class="sb-btn sb-soft cursor-interaction" type="button" data-action="month">월 선택</button><button class="sb-btn cursor-interaction" type="button" disabled>저장 불가</button></div><span class="sb-label">칩 · 선택과 정보</span><div class="sb-chips" data-group="sound"><button type="button" class="sb-chip cursor-interaction" aria-pressed="false">소리+진동</button><button type="button" class="sb-chip cursor-interaction" aria-pressed="true">진동</button><button type="button" class="sb-chip cursor-interaction" aria-pressed="false">무음</button></div><span class="sb-label">입력 · 명확한 제목과 도움말</span><label class="sb-fieldlabel">근무명<input class="sb-field" value="주간근무" maxlength="12" aria-label="근무명 미리보기"></label><div class="sb-help">달력과 알람에 표시할 이름</div><span class="sb-label">선택기 · 시각 / 기간 / 년월</span><button type="button" class="sb-btn sb-choice cursor-interaction" data-action="time">알람 시각<span data-time>07:30</span>${icon('chevron-right')}</button><button type="button" class="sb-btn sb-choice cursor-interaction" data-action="duration">스누즈 간격<span data-duration>5분</span>${icon('chevron-right')}</button><button type="button" class="sb-btn sb-choice cursor-interaction" data-action="month">년월 선택<span data-month-short>2026. 10</span>${icon('chevron-right')}</button><label class="sb-switchrow"><span>알람 사용</span><input type="checkbox" class="sb-toggle cursor-interaction" checked aria-label="알람 사용 미리보기"></label><span class="sb-label">팝업 · 결정과 확인</span><button type="button" class="sb-btn sb-choice cursor-interaction" data-action="delete">삭제 확인 미리보기${icon('arrow-up-right')}</button><button type="button" class="sb-btn sb-primary sb-preference cursor-interaction" data-action="prefer">이 세트가 마음에 들어요</button></aside></div><div class="sb-footer" role="status" aria-live="polite">디자인 시안 · 알람 예약과 실제 데이터에 연결되지 않음</div>`;
  const phone=stage.querySelector('.sb-phone'),overlay=stage.querySelector('.sb-overlay'),footer=stage.querySelector('.sb-footer');
  let returnFocus=null;
  const refreshIcons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});};
  const notify=(text)=>{footer.textContent=text;};
  const timeText=()=>`${String(state.hour).padStart(2,'0')}:${String(state.minute).padStart(2,'0')}`;
  const sync=()=>{stage.querySelectorAll('[data-time]').forEach(el=>el.textContent=timeText());stage.querySelector('[data-next]').textContent=state.deleted?'예약된 알람 없음':`내일 ${timeText()} · ${state.sound}`;stage.querySelector('[data-month-short]').textContent=`${state.year}. ${String(state.month).padStart(2,'0')}`;stage.querySelector('[data-month-label]').textContent=`${state.year}년 ${state.month}월`;stage.querySelector('[data-duration]').textContent=state.snooze+'분';stage.querySelector('.sb-sectionhead .sb-caption').textContent=(state.year===2026&&state.month===10&&state.selectedDay===12)?'오늘':'';};
  const close=()=>{overlay.hidden=true;overlay.innerHTML='';if(returnFocus?.isConnected)returnFocus.focus();};
  const show=(title,description,content,action,label='확인')=>{returnFocus=document.activeElement;overlay.innerHTML=`<div class="sb-dialog" role="dialog" aria-modal="true" aria-label="${title}"><h3>${title}</h3><p>${description}</p>${content}<div class="sb-actions"><button class="sb-btn sb-fill cursor-interaction" type="button" data-close>취소</button><button class="sb-btn sb-primary sb-fill cursor-interaction ${action==='confirm-delete'?'sb-destructive-fill':''}" type="button" data-confirm="${action}">${label}</button></div></div>`;overlay.hidden=false;refreshIcons();overlay.querySelector('input,select,button')?.focus();};
  function open(action){
   if(action==='time')show('알람 시각','주간근무 · 당일 알람',`<div class="sb-timeinputs"><label><span class="sb-fieldlabel">시</span><input type="number" inputmode="numeric" class="sb-field sb-number" data-hour min="0" max="23" value="${state.hour}" aria-label="시"></label><strong>:</strong><label><span class="sb-fieldlabel">분</span><input type="number" inputmode="numeric" class="sb-field sb-number" data-minute min="0" max="59" value="${state.minute}" aria-label="분"></label></div><div class="sb-preset"><button type="button" class="sb-chip cursor-interaction" data-preset="7:0">07:00</button><button type="button" class="sb-chip cursor-interaction" data-preset="7:30">07:30</button><button type="button" class="sb-chip cursor-interaction" data-preset="8:0">08:00</button></div>`,'time','저장');
   else if(action==='duration')show('스누즈 간격','시각과 구분되는 기간 선택',`<div class="sb-chips" data-group="duration">${[5,10,15,20,30].map(n=>`<button type="button" class="sb-chip cursor-interaction" data-minutes="${n}" aria-pressed="${n===state.snooze}">${n}분</button>`).join('')}</div>`,'duration');
   else if(action==='month'){show('년월 선택','원하는 달로 이동',`<div class="sb-yearrow"><button class="sb-iconbtn cursor-interaction" type="button" data-year="-1" aria-label="이전 해">${icon('chevron-left')}</button><strong data-year-value>${state.year}년</strong><button class="sb-iconbtn cursor-interaction" type="button" data-year="1" aria-label="다음 해">${icon('chevron-right')}</button></div><div class="sb-monthgrid">${Array.from({length:12},(_,i)=>`<button class="sb-chip cursor-interaction" type="button" data-month="${i+1}" aria-pressed="${i+1===state.month}">${i+1}월</button>`).join('')}</div>`,'month','이동');overlay.dataset.year=state.year;overlay.dataset.month=state.month;}
   else if(action==='delete')show('이 알람을 삭제할까요?',`주간근무 · ${timeText()} · ${state.sound}<br>선택한 알람을 목록에서 삭제합니다.`,'','confirm-delete','삭제');
   else if(action==='save')notify('저장 완료 · 시안 안에서만 반영되었습니다.');
   else if(action==='cancel')notify('변경을 취소했습니다.');
   else if(action==='settings')show('알람 설정','공통 설정 행과 스위치',`<label class="sb-switchrow"><span>진동 피드백</span><input class="sb-toggle cursor-interaction" type="checkbox" checked></label><label class="sb-switchrow"><span>애니메이션</span><input class="sb-toggle cursor-interaction" type="checkbox" checked></label>`,'settings');
   else if(action==='prefer'){saveState(design.name);root.querySelectorAll('[data-action="prefer"]').forEach(b=>{b.textContent='이 세트가 마음에 들어요';b.setAttribute('aria-pressed','false');});const chosen=stage.querySelector('[data-action="prefer"]');chosen.textContent='선호 세트: '+design.name;chosen.setAttribute('aria-pressed','true');notify(design.name+' 선택 · 마음에 드는 요소를 대화로 알려주세요.');}
  }
  stage.addEventListener('click',event=>{
   const b=event.target.closest('button');if(!b||!stage.contains(b))return;
   if(b.dataset.action){open(b.dataset.action);return;}
   if(b.hasAttribute('data-close')){close();return;}
   if(b.dataset.confirm){const kind=b.dataset.confirm;
    if(kind==='time'){const h=overlay.querySelector('[data-hour]'),m=overlay.querySelector('[data-minute]');if(!h.reportValidity()||!m.reportValidity()||h.value===''||m.value==='')return;state.hour=Number(h.value);state.minute=Number(m.value);}
    if(kind==='duration'){state.snooze=Number(overlay.querySelector('[data-minutes][aria-pressed="true"]').dataset.minutes);}
    if(kind==='month'){state.year=Number(overlay.dataset.year);state.month=Number(overlay.dataset.month);renderMonth();}
    if(kind==='confirm-delete'){state.deleted=true;stage.querySelector('[data-alarm-area]').innerHTML='<div class="sb-toast"><span>알람을 삭제했습니다</span><button type="button" class="sb-btn sb-quiet cursor-interaction" data-undo>되돌리기</button></div>';}
    sync();close();notify(kind==='confirm-delete'?'삭제 완료 · 되돌리기로 복원할 수 있습니다.':'선택을 적용했습니다 · 시안 안에서만 반영됩니다.');return;
   }
   if(b.dataset.preset){const [h,m]=b.dataset.preset.split(':');overlay.querySelector('[data-hour]').value=h;overlay.querySelector('[data-minute]').value=m;return;}
   if(b.dataset.year){overlay.dataset.year=Number(overlay.dataset.year)+Number(b.dataset.year);overlay.querySelector('[data-year-value]').textContent=overlay.dataset.year+'년';return;}
   if(b.dataset.month){overlay.dataset.month=b.dataset.month;overlay.querySelectorAll('[data-month]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}
   if(b.hasAttribute('data-undo')){state.deleted=false;stage.querySelector('[data-alarm-area]').innerHTML=alarmMarkup;sync();refreshIcons();notify('알람을 복원했습니다.');return;}
   if(b.dataset.day){const d=Number(b.dataset.day);if(d<1||d>31)return;stage.querySelectorAll('[data-day]').forEach(x=>{x.classList.toggle('sb-selected',x===b);x.setAttribute('aria-pressed',String(x===b));});state.selectedDay=d;stage.querySelector('[data-date-label]').textContent=state.month+'월 '+d+'일';return;}
   if(b.dataset.nav){stage.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('sb-active',x===b));notify(b.dataset.nav+' 탭 선택 · 이 시안에서는 달력 구성만 표시합니다.');return;}
   const group=b.closest('[data-group]');if(group){group.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(group.dataset.group==='sound'){state.sound=b.textContent;stage.querySelector('[data-sound]')?.replaceChildren(document.createTextNode(state.sound));sync();}if(group.dataset.group==='shift')notify(b.textContent+' 선택 · 칩 상태 미리보기');}
  });
  const alarmMarkup=stage.querySelector('[data-alarm-area]').innerHTML;
  function renderMonth(){const first=new Date(state.year,state.month-1,1).getDay(),length=new Date(state.year,state.month,0).getDate();stage.querySelector('.sb-days').innerHTML=Array.from({length:Math.ceil((first+length)/7)*7},(_,i)=>{const d=i-first+1;return d<1||d>length?'<span class="sb-day sb-out"></span>':`<button type="button" class="sb-day cursor-interaction ${d===12?'sb-selected':''}" data-day="${d}" aria-pressed="${d===12}"><span>${d}</span><small>${(d===12||d===13)?'주간':d%4===0?'휴무':'주간'}</small></button>`;}).join('');stage.querySelector('[data-date-label]').textContent=state.month+'월 12일';}
  overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
  stage.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const items=[...overlay.querySelectorAll('button,input,select')].filter(x=>!x.disabled),first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  stage.querySelector('.sb-toggle').addEventListener('change',e=>notify(e.target.checked?'알람 사용 켜짐 · 표시 시안':'알람 사용 꺼짐 · 표시 시안'));
  if(globalThis.Tweak){const controls={radius:design.radius};const tweak=new Tweak({container:stage.querySelector('.sb-kit'),onChange:()=>stage.style.setProperty('--sb-radius',controls.radius+'px')});tweak.addSlider(controls,'radius',{label:'카드 둥글기',min:6,max:28,unit:'px'});}
 });
 const saved=window.openai?.widgetState?.modelContent?.preferredDesign;if(saved)root.querySelectorAll('[data-action="prefer"]').forEach(b=>{if(designs[b.closest('.sb-stage').dataset.set].name===saved){b.textContent='선호 세트: '+saved;b.setAttribute('aria-pressed','true');}});
 window.addEventListener('openai:set_globals',e=>{const name=e.detail?.globals?.widgetState?.modelContent?.preferredDesign;if(name)root.querySelectorAll('[data-action="prefer"]').forEach(b=>{const selected=designs[b.closest('.sb-stage').dataset.set].name===name;b.textContent=selected?'선호 세트: '+name:'이 세트가 마음에 들어요';b.setAttribute('aria-pressed',String(selected));});});
})();
</script>
